name: No transient plan files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pushed commit or PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fail when Superpowers artifacts are present
        run: |
          artifacts=$(git ls-tree -r --name-only HEAD | grep -E '^(docs/superpowers/|\.superpowers/)' || true)
          if [ -n "$artifacts" ]; then
            echo "::error::Transient plan files must not reach main:"
            echo "$artifacts"
            echo "::error::Graduate lasting decisions to docs/adr/ or ARCHITECTURE.md, delete docs/superpowers/ and .superpowers/, then retry."
            exit 1
          fi
